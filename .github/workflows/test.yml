name: 测试

# 每次推送与 PR 都自动跑测试。依赖仓库外文件（真实论文、版面模型）的用例
# 由 conftest.py 自动 skip，故在 GitHub 干净环境也是绿的。
#
# dev 也在监听范围内：dev 是实际开发分支，若只在 main 上跑，等于"改了没回归"。
# fork 出来的仓库记得去 Settings → Actions 手动启用本 workflow（fork 默认不跑）。
on:
  push:
    branches: [main, dev]
    paths: ["程序/**", ".github/workflows/test.yml"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 程序
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（最小集，跳过 OCR 重依赖以加速）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # 规则集与"为什么只开这几条"见 程序/pyproject.toml。
      # 锁定次版本：ruff 升级会新增/调整规则，未锁定时 CI 可能因新版规则变红，
      # 而那时人往往正忙别的事。要升就显式改这行（Dependabot 不盯 pip 生态）。
      - name: 代码检查（ruff）
        run: |
          pip install "ruff>=0.17,<0.18"
          ruff check .

      - name: 运行测试
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests -q --junitxml=test-results.xml

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: 程序/test-results.xml
          if-no-files-found: ignore
