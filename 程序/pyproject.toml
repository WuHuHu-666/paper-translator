# 工具链配置。
#
# 这不是打包配置：本项目用 PyInstaller 出 exe/.app，不发 PyPI 包，故**刻意不写
# [project]**——写了会让 `pip install -e .` 以为这是个可安装分发包。这里只放
# lint 与测试的配置，让 `ruff check` 与 `pytest` 在 程序/ 下零参数即可正确运行。

[tool.ruff]
# 中文注释密度高，80 列会逼出大量为对齐而生的换行；100 更贴近实际排版宽度。
line-length = 100
# CI 与打包统一用 3.11（源码在 3.13 上同样通过）。
target-version = "py311"

[tool.ruff.lint]
# 只启用「确定性错误」：语法错误、未定义名、未用导入/变量、导入顺序。
# 这一档能立刻全绿（不会为了过门禁去改业务代码），又能挡住最常见的低级缺陷。
#
# 收紧顺序建议（每一步都能先 --fix 再人工过一遍）：
#   ① 加 "UP037"/"UP017"（引号注解、datetime.UTC，可自动修）；
#   ② 加 "B"，但需人工审 B905（zip 缺 strict）与 B023（循环变量捕获）；
#   ③ 代码再稳定些可加 "BLE001"，本项目的 `except Exception:  # noqa: BLE001`
#      注释已经是按该规则写的，届时大部分无需改动。
select = ["E9", "F", "I"]

# 明确**不启用**的规则（附理由，免得后人以为是漏配）：
#   E501 行太长——注释密度极高，100 列上限对中文注释没有约束意义；
#   E741 变量名 l/I/O——矩阵/公式代码里单字母下标是行话；
#   UP045 Optional[X] → X | None——作者通篇用 Optional 表达"可缺省"，
#         属有意风格，改成 PEP 604 会让 45 处 diff 淹没真正的改动。

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
